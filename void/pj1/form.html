<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <h1>Form</h1>

    </header>

    <main>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <label for="username">Username:</label>
        <input type="text" id="username" minlength="6" maxlength="20" required>
        <br>
        <label for="password">Password:</lable>
        <input type="password" id="password" minlength="8" required>
        <br>
        <label for="email">Email:</lable>
        <input type="email" id="email" required placeholder="myname@gmail.com">
        <br>
        <label for="phone">Phone #:</label>
        <input type="tel" id="phone" required>
        <br>
        <label fpr"bday">birthdate:</label>
        <input type="date" id="bday">
        <br>
        <label for="title">Title:</label>
        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." name="title" value="Mr.">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." name="title" value="Ms.">
        <br>
        <label for="payment">Payment:</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="giftcard">gift card</option>
        </select>
        <br>
        <label for="subcribe">Subscribe:</label>
        <input type="checkbox" id="subcribe">
        <br>
        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea>
        <br>
        <label for="file">File:</label>
        <input type="file" id="file">


        <br>
        <input type="reset">
        <br>
        <input type="submit">

    </form>
    </main>

    <footer>

    </footer>

</body>
</html>
